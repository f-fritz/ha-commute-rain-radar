blueprint:
  name: Commute Rain notification
  description: >
    Push the best departure and the expected rain for one commute leg at a
    fixed time, with the rain heatmap attached. The radar is only polled from
    2 h before the leg's window, so pick a time inside that range.
  domain: automation
  input:
    notify_action:
      name: Notify action
      description: e.g. notify.mobile_app_my_phone
      selector:
        text:
    at_time:
      name: Time
      default: "06:45:00"
      selector:
        time:
    weekdays:
      name: Days
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options:
            - { label: Monday, value: mon }
            - { label: Tuesday, value: tue }
            - { label: Wednesday, value: wed }
            - { label: Thursday, value: thu }
            - { label: Friday, value: fri }
            - { label: Saturday, value: sat }
            - { label: Sunday, value: sun }
    rain_now:
      name: Rain if leaving now
      selector:
        entity:
          filter: { integration: commute_rain, domain: sensor }
    best_departure:
      name: Best departure
      selector:
        entity:
          filter: { integration: commute_rain, domain: sensor, device_class: timestamp }
    best_rain:
      name: Rain at best departure
      selector:
        entity:
          filter: { integration: commute_rain, domain: sensor }
    forecast_rain:
      name: Forecast rain next window (fallback when the radar has no answer)
      selector:
        entity:
          filter: { integration: commute_rain, domain: sensor }
    heatmap:
      name: Rain heatmap
      selector:
        entity:
          filter: { integration: commute_rain, domain: image }

triggers:
  - trigger: time
    at: !input at_time

conditions:
  - condition: time
    weekday: !input weekdays

variables:
  notify_action: !input notify_action
  rain_now: !input rain_now
  best_departure: !input best_departure
  best_rain: !input best_rain
  forecast_rain: !input forecast_rain
  heatmap: !input heatmap
  missing: ["unknown", "unavailable", "none", ""]

actions:
  - action: "{{ notify_action }}"
    data:
      title: >-
        {% set best = states(best_departure) %}
        {% if best not in missing %}Leave at {{ as_timestamp(best) | timestamp_custom('%H:%M') }}
        {% else %}No dry departure{% endif %}
      message: >-
        {% set best = states(best_departure) %}
        {% set now_mm = states(rain_now) %}
        {% if best not in missing %}Best departure {{ as_timestamp(best) | timestamp_custom('%H:%M') }}: {{ states(best_rain) }} mm.
        {% elif now_mm not in missing %}No departure stays within {{ state_attr(rain_now, 'max_rain_mm_per_h') }} mm/h.
        {% else %}No radar data yet.
        {% endif %}
        {% if now_mm not in missing %}Leaving now: {{ now_mm }} mm.{% endif %}
        Forecast for the window: {{ states(forecast_rain) }} mm, up to {{ state_attr(forecast_rain, 'max_probability') }} % chance.
      data:
        image: "/api/image_proxy/{{ heatmap }}"
